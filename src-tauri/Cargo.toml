[package]
name = "nav-toolbox"
version = "0.1.1"
description = "A quick command launcher for Fedora and Linux"
edition = "2021"

[lib]
name = "nav_toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
# Match Tauri's tray-icon version so Cargo enables KSNI on the same instance.
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }
